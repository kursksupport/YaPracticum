services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: usersdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usersdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: eventapi-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookingsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookingsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-api:
    build:
      context: .
      dockerfile: Users/Users.Api/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__UsersDb: Host=users-db;Port=5432;Database=usersdb;Username=postgres;Password=postgres
      Jwt__Secret: your-super-secret-key-for-jwt-token
      Jwt__Issuer: EventManagementService
      Jwt__Audience: EventManagementService
    depends_on:
      users-db:
        condition: service_healthy

  events-api:
    build:
      context: .
      dockerfile: Events/Events.Api/Dockerfile
    ports:
      - "8082:8080"
    environment:
      ConnectionStrings__EventsDb: Host=events-db;Port=5432;Database=eventsdb;Username=postgres;Password=postgres
      Redis__ConnectionString: redis:6379
      Kafka__BootstrapServers: kafka:29092
      Kafka__ConsumerGroup: events-service
      Jwt__Secret: your-super-secret-key-for-jwt-token
      Jwt__Issuer: EventManagementService
      Jwt__Audience: EventManagementService
    depends_on:
      events-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  bookings-api:
    build:
      context: .
      dockerfile: Bookings/Bookings.Api/Dockerfile
    ports:
      - "8083:8080"
    environment:
      ConnectionStrings__BookingsDb: Host=bookings-db;Port=5432;Database=bookingsdb;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:29092
      Jwt__Secret: your-super-secret-key-for-jwt-token
      Jwt__Issuer: EventManagementService
      Jwt__Audience: EventManagementService
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
